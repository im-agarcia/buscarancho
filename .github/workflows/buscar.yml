name: Buscar propiedades

on:
  schedule:
    # 8:00, 12:00 y 18:00 de Argentina (UTC-3). GitHub puede demorar el arranque algunos minutos.
    - cron: "0 11,15,21 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: buscar
  cancel-in-progress: false

jobs:
  buscar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Buscar
        id: buscar
        run: python -m buscarancho
        env:
          PANEL_URL: ${{ vars.PANEL_URL }}
          PANEL_TOKEN: ${{ secrets.PANEL_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Guardar historial
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Corrida $(TZ=America/Argentina/Buenos_Aires date '+%Y-%m-%d %H:%M')"
          git push

      # Un issue por corrida con novedades: GitHub te lo manda por mail y a la app del celular
      - name: Avisar novedades
        if: steps.buscar.outputs.novedades == 'true'
        run: gh issue create --title "$TITULO" --body-file data/ultima_corrida.md
        env:
          GH_TOKEN: ${{ github.token }}
          TITULO: ${{ steps.buscar.outputs.titulo }}
